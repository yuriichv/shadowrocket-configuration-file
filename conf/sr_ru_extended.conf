# Shadowrocket: main / пользовательские правила
#
# Принцип работы: файл подключается к lite/full-конфигам через `include` и не
# перезаписывается при обновлении основного конфига. Правила из секции [Rule]
# применяются раньше финального DIRECT, поэтому здесь размещаются собственные
# исключения и дополнения к маршрутизации.
# Для работы include этот файл также скачивается в Shadowrocket вместе с основным.

[General]

[Rule]
# Персональный список доменов (см. rules/domain_custom.list в репозитории)
RULE-SET,https://cdn.jsdelivr.net/gh/yuriichv/shadowrocket-configuration-file@main/rules/domain_custom.list,PROXY

# --- собственные правила ---
# DOMAIN-SUFFIX,example.com,PROXY
# DOMAIN-KEYWORD,example,PROXY
# IP-CIDR,1.2.3.4/32,PROXY,no-resolve
